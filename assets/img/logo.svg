<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Vàng Bạc Đá Quý Nhật Anh">
  <defs>
    <radialGradient id="bg" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#5a4212"/>
      <stop offset="55%" stop-color="#2e2108"/>
      <stop offset="100%" stop-color="#160f03"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1b8"/>
      <stop offset="40%" stop-color="#e2be4e"/>
      <stop offset="75%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#8c6a1b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#7d5d15"/>
    </linearGradient>
    <linearGradient id="gemTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf2"/>
      <stop offset="100%" stop-color="#f1d783"/>
    </linearGradient>
    <linearGradient id="gemBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9cf74"/>
      <stop offset="100%" stop-color="#b08a1f"/>
    </linearGradient>
  </defs>

  <!-- Nền huy hiệu + viền vàng kép -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
  <circle cx="50" cy="50" r="46.5" fill="none" stroke="url(#gold)" stroke-width="1.8"/>
  <circle cx="50" cy="50" r="42.5" fill="none" stroke="#d4af37" stroke-width="0.7" opacity="0.55"/>

  <!-- Chiếc nhẫn -->
  <circle cx="50" cy="61" r="17.5" fill="none" stroke="#5a4212" stroke-width="7.5" opacity="0.6"/>
  <circle cx="50" cy="61" r="17.5" fill="none" stroke="url(#ring)" stroke-width="5.5"/>
  <circle cx="50" cy="61" r="17.5" fill="none" stroke="#fff6d5" stroke-width="0.9" opacity="0.55"/>

  <!-- Viên kim cương -->
  <polygon points="42,25 58,25 65,34 35,34" fill="url(#gemTop)"/>
  <polygon points="35,34 65,34 50,53" fill="url(#gemBottom)"/>
  <g fill="none" stroke="#ffffff" stroke-width="0.8" stroke-linejoin="round" opacity="0.75">
    <polyline points="42,25 46,34 50,25 54,34 58,25"/>
    <line x1="35" y1="34" x2="65" y2="34"/>
    <line x1="46" y1="34" x2="50" y2="53"/>
    <line x1="54" y1="34" x2="50" y2="53"/>
    <line x1="35" y1="34" x2="42" y2="25"/>
    <line x1="65" y1="34" x2="58" y2="25"/>
  </g>
  <polygon points="42,25 58,25 65,34 50,53 35,34" fill="none" stroke="#8c6a1b" stroke-width="0.9" opacity="0.8"/>

  <!-- Tia sáng -->
  <g fill="#fff8dc">
    <path d="M70 20 l1.4 4.2 4.2 1.4 -4.2 1.4 -1.4 4.2 -1.4 -4.2 -4.2 -1.4 4.2 -1.4z"/>
    <path d="M29 42 l0.9 2.6 2.6 0.9 -2.6 0.9 -0.9 2.6 -0.9 -2.6 -2.6 -0.9 2.6 -0.9z" opacity="0.85"/>
  </g>
</svg>
